name: ci

on: [push, pull_request]

jobs:
  linux:
    strategy:
      matrix:
        # 对齐上游 nob.h 的 CI 做法：C 与 C++ 两种语言模式，两个编译器都跑
        cc: [clang, gcc]
        lang: [c, c++]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建构建脚本（${{ matrix.cc }} -x ${{ matrix.lang }}）
        run: ${{ matrix.cc }} -x ${{ matrix.lang }} -o cb cb.c

      - name: 跑测试（含双编译器 C++ 兼容性检查）
        run: ./cb test

      - name: 跑全部示例（${{ matrix.cc }} -x ${{ matrix.lang }}）
        # 示例必须真的跑起来：01/02/03 会自己去编译它们写出来的小程序，
        # 路径或命令行写错只有跑过才发现（本地不跑就等于没检查）。
        # 用 matrix 的编译器与语言，不能让 C++ leg 拿 cc -std=c99 跑过去：
        # 那样 clang 从没编过示例、C++ 也从未被验证。
        # 脚本内部跑两遍（默认链接 + 模拟 Ubuntu 默认的 --as-needed），失败打印全部输出。
        # 本地同一条命令：CC=${{ matrix.cc }} CB_LANG=${{ matrix.lang }} tools/verify-examples.sh
        run: CC="${{ matrix.cc }}" CB_LANG="${{ matrix.lang }}" tools/verify-examples.sh

  cxx-tests:
    # 为什么单独一个 job：linux job 里 C++ 那两个组合已经在跑 ./cb test，但本地开发者
    # 通常只跑 C 模式，"指定初始化器顺序不对"和"{0} 在 C++ 下的告警"这两类问题就只会在
    # CI 上冒出来（C 下永远不报）。这个 job 把 C++ 那条路径固定下来：clang++/g++ ×
    # c++17/c++20 各构建一次 cb、各跑一遍全部测试，要求全过（数字取自 ./cb list）且 0 告警。
    # 本地同一条命令：tools/verify-cxx-tests.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: C++ 模式测试与告警检查
        run: tools/verify-cxx-tests.sh

  strict-warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 严格警告矩阵（要求 0 错误 0 警告）
        run: |
          set -e
          for spec in "clang -std=c99 -D_POSIX_C_SOURCE=200112L -pedantic" \
                      "gcc -std=c99 -D_POSIX_C_SOURCE=200112L -pedantic" \
                      "clang -std=c11 -D_POSIX_C_SOURCE=200112L" \
                      "gcc -std=c11 -D_POSIX_C_SOURCE=200112L" \
                      "clang -std=gnu99" "gcc -std=gnu99"; do
            echo "== $spec =="
            out=$($spec -Wall -Wextra -I. -fsyntax-only cb.c 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q 'error:\|warning:'; then
              echo "FAILED: $spec 产生了错误或警告"
              exit 1
            fi
          done

      - name: 开启 CB_STRIP_PREFIX 后仍要 0 警告
        run: |
          mkdir -p build
          printf '#define CB_STRIP_PREFIX\n#include "cb.h"\nint main(void){return 0;}\n' > build/sp.c
          clang -std=c99 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -I. -c build/sp.c -o build/sp.o
          gcc   -std=c99 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -I. -c build/sp.c -o build/sp2.o
          echo "clang/gcc: 0 警告"

  windows-cross:
    # 在 Linux 上用 mingw-w64 交叉编译，再用 wine 真正运行全部测试。
    # 这能抓到"只编译不运行"发现不了的问题：Windows 分支此前从未被编译过，
    # 一编就暴露出 shellapi.h 顺序错误、未定义的函数、拼写错误等一堆问题。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 mingw-w64 与 wine
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine64

      - name: Windows 交叉编译验证
        run: tools/verify-windows.sh

      - name: CB_STRIP_PREFIX 别名区不得与系统头撞名
        # mingw 的 <wingdi.h> 定义了 ERROR，别名区必须用 #ifndef 让系统定义优先。
        # 这里用 -Werror 把"宏重定义"变成硬失败。
        run: |
          mkdir -p build
          printf '#define CB_STRIP_PREFIX\n#include "cb.h"\nint main(void){return 0;}\n' > build/sp.c
          x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -Werror -I. -c build/sp.c -o build/sp.o
          echo "mingw: 0 警告"

  sanitizers:
    # "测试全绿"和"内存干净"是两条独立的证据。这个任务第一次跑就抓到了
    # cb_da_append_many 对 NULL 调 memmove 的 UB，以及 cb_read_entire_file
    # 忘了给 '\0' 留位置导致的越界读——两者在普通构建下都看不出来。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASan + UBSan + LeakSanitizer
        run: tools/verify-sanitizers.sh

      - name: 示例也在检测器下跑一遍
        # 示例的覆盖面比测试宽（每个示例专门演示一个模块），而且它们自己会分配内存：
        # 02/04 就漏过 CB_Cmd 的 items（每个 2048 字节），普通运行完全看不出来。
        # 本地同一条命令：tools/verify-sanitizers.sh --examples
        run: tools/verify-sanitizers.sh --examples
